<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="claude-brainlab — a research workbench for Claude Code, BRAIn Lab house style">
  <rect width="1200" height="220" fill="#FFFFFF"/>

  <!-- Node glyph: the graph mark of the lab logo, drawn plainly. -->
  <g fill="none" stroke="#9DE1FC" stroke-width="7" stroke-linecap="round">
    <path d="M96 62 L96 158"/>
    <path d="M96 62 L172 110"/>
    <path d="M96 158 L172 110"/>
    <path d="M96 62 L172 158"/>
  </g>
  <g fill="#FFD25A">
    <circle cx="96" cy="62" r="12"/>
    <circle cx="96" cy="158" r="12"/>
    <circle cx="172" cy="110" r="12"/>
    <circle cx="172" cy="158" r="9"/>
  </g>

  <text x="236" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="52" font-weight="bold" fill="#8D4866">claude-brainlab</text>
  <rect x="236" y="124" width="640" height="3" fill="#9DE1FC"/>
  <text x="236" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#5B6570">A research workbench for Claude Code — literature, experiments, writing, and a shared lab base.</text>

  <text x="1148" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#8D4866" text-anchor="end" font-weight="bold">BRAIn Lab</text>
  <text x="1148" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6570" text-anchor="end">Basic Research of Artificial Intelligence</text>
</svg>
