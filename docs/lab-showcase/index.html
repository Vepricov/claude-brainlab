<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="language.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="The BRAIn Lab research system">
  <title>BRAIn Lab · Research Loop</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="refinements.css?v=overview-fit-20260911">
  <link rel="stylesheet" href="map-shapes.css">
  <link rel="stylesheet" href="mcp-design.css?v=simple-search-20260917">
  <link rel="stylesheet" href="front-design.css?v=ideation-20260917">
  <link rel="stylesheet" href="memory-map.css">
  <link rel="stylesheet" href="obsidian-setup.css?v=workspaces-20260911">
  <link rel="stylesheet" href="surface-pages.css?v=workspaces-20260911">
  <link rel="stylesheet" href="search-workspace.css?v=search-footer-20260917">
  <link rel="stylesheet" href="language.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" aria-label="BRAIn Lab" id="home" type="button"><span class="brand-sign"><i></i><i></i></span><span><b>BRAIn Lab</b><small>Research system</small></span></button>
    <nav class="view-switch" aria-label="Explore the lab"><button class="active" data-view="loop" type="button">Atlas</button><button data-view="mcp-live" type="button">Demo library</button><button data-view="examples" type="button">Research journeys</button></nav>
    <button class="search-open" id="search-open" type="button"><span>Find a workflow or tool</span><kbd>⌘ K</kbd></button>
    <nav class="language-switch" aria-label="Language"><a data-language="en" lang="en" href="?lang=en">EN</a><a data-language="ru" lang="ru" href="ru/index.html?lang=ru">RU</a></nav>
  </header>

  <main>
    <section class="overview" id="overview">
      <header class="overview-head">
        <p class="overline">The research system · <span id="verified-date"></span></p>
        <h1>How a lab turns<br> a question into<br> <span>knowledge</span></h1>
        <p class="overview-intro">One research cycle connects papers, discussions, hypotheses, experiments, results, and publications. Explore a stage to see the workflow and its tools.</p>
      </header>

      <div class="loop-map" id="loop-map" aria-label="Research workflow map">
        <div class="loop-nodes" id="loop-nodes"></div>
        <section class="knowledge-cluster" aria-label="Four layers of memory and coordination">
          <button class="knowledge-core" id="knowledge-core" type="button">
            <span>Shared, verifiable knowledge</span><strong>Lab Knowledge<br>MCP</strong><p>claims · runs · measurements · rules</p><i>Explore the map →</i>
          </button>
          <div class="memory-surfaces">
            <button data-surface="obsidian" type="button"><b>Obsidian</b><span>personal notes and research log</span></button>
            <button data-surface="mempalace" type="button"><b>MemPalace</b><span>agent memory and history</span></button>
            <button data-surface="yonote" type="button"><b>Yonote</b><span>project pages and team tasks</span></button>
          </div>
        </section>
      </div>


      <p class="loop-tally" id="loop-tally"></p>

      <section class="toolkit" id="toolkit" aria-labelledby="toolkit-title"></section>
    </section>

    <article class="process-view" id="process-view" hidden></article>
    <article class="dykaf-view" id="dykaf-view" hidden></article>
    <article class="mcp-live-view" id="mcp-live-view" hidden></article>
    <article class="examples-view" id="examples-view" hidden></article>
  </main>

  <dialog class="search-dialog" id="search-dialog">
    <form method="dialog" class="search-head"><label><span aria-hidden="true">⌕</span><span class="sr-only">Search workflows and tools</span><input id="search-input" type="search" placeholder="Try: process a meeting, Hermes, rebuttal…" autocomplete="off"></label><button value="close" aria-label="Close">×</button></form>
    <div class="search-results" id="search-results"></div>
  </dialog>

  <script src="en/data/demo-flag.js?v=general-questions-20260916"></script>
  <script src="en/data/atlas-public.js?v=ideation-20260917"></script>
  <script src="en/data/research-loop-data.js?v=ideation-20260917"></script>
  <script src="en/data/system-examples.js?v=ideation-20260917"></script>
  <!-- Scientific snapshots load on demand when the search workspace opens. -->
  <!-- Ядро поиска: один индекс на узлы дерева, записи базы и статьи, ранжирование BM25.
       Отдельный файл, потому что его гоняет набор проверок tests/test_search.mjs без
       браузера — 38 запросов за секунду, поэтому качество меряется, а не обсуждается. -->
  <script src="en/search-core.js"></script>
  <script src="en/memory-map.js"></script>
  <script src="en/surface-pages.js?v=concise-dossiers-20260911"></script>
  <script src="en/obsidian-setup.js?v=workspaces-20260911"></script>
  <script src="en/app.js?v=ideation-20260917"></script>
</body>
</html>
